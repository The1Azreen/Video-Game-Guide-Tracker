[package]
name = "jagt"
version = "0.1.0"
edition = "2021"
description = "Just Another Guide Tracker - keep your place in every video game guide"
repository = "https://github.com/The1Azreen/Video-Game-Guide-Tracker"

[[bin]]
name = "jagt"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "persistence", "wayland", "x11"] }
egui = "0.31"
ureq = { version = "2.12", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "gif", "webp", "bmp"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
memmap2 = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
open = "5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
